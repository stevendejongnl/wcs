[project]
name = "webcomponentsscan"
version = "1.0.1"
description = "WCS is a Python application that scans HTML files within a specified directory based on the @custom-elements-manifest/analyzer npm package. This npm packages generates a custom-elements.json file containing information about custom HTML tags. With this file we can scan html files for implementations."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Steven de Jong" },
]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "flake8==7.3.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webcomponentsscan"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["webcomponentsscan/__init__.py:__version__"]
build_command = "uv lock && uv build"
assets = ["uv.lock"]
major_on_zero = false
commit_parser = "conventional"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
exclude_commit_patterns = []

[tool.semantic_release.remote]
type = "github"
