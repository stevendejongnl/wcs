name: CI

on:
  pull_request:

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: mypy
        run: uv run mypy --config-file mypy.ini .

      - name: flake8
        run: uv run flake8 .

      - name: pytest
        run: uv run pytest
